[project]
name = "llm-preprocessing-short-texts"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "scipy>=1.11",
    "statsmodels>=0.14.4",
    "krippendorff>=0.6",

    "scikit-learn>=1.4",
    "bertopic>=0.16",
    "umap-learn>=0.5",
    "hdbscan>=0.8.40",
    "gensim>=4.3",

    "pymorphy3>=2.0",
    "pymorphy3-dicts-ru>=2.4",
    "nltk>=3.8",

    "requests>=2.31",
    "python-dotenv>=1.0",

    "tqdm>=4.66",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.8",
    "plotly>=5.20",
]
dev = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []